dataset:
  task: noAer
  sample_dir: data/h5
  sample_glob: sample_2025????12.h5
  max_files: null
  require_explicit_splits: true
  target_key: bt13_future
  target_valid_mask_key: bt13_future_valid_mask
  history_key: bt13_hist
  history_valid_mask_key: bt13_hist_valid_mask
  forecast_hours: 24
  cascade_horizon: 8
  cascade_blocks: 5
  cascade_start_hours:
  - 0
  - 4
  - 8
  - 12
  - 16
  cascade_blend_weights:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.0
  - 0.75
  - 0.5
  - 0.25
  history_length: 25
  patch_size:
  - 144
  - 184
  patches_per_file: 12
  patch_sampling: random
  include_cloud_hist: true
  include_bt13_hist: true
  include_future_bt13_as_condition: false
  include_coszen: true
  include_daylight_mask: true
  include_wrf_meteo: true
  include_wrf_rad: true
  include_aod550: false
  include_k_wrf: true
  include_aerosol_column_summary: false
  include_aerosol_full3d: false
  include_wrf_cloud: true
  require_wrf_cloud: true
  wrf_cloud_expected_spatial_shape:
  - 149
  - 191
  wrf_cloud_expected_names:
  - TSK
  - CLDFRA_LOW
  - CLDFRA_MID
  - CLDFRA_HIGH
  - LWP
  - FROZEN_WP
  - CTOP_HGT
  - CTOP_TEMP
  - RH_LOW
  - RH_MID
  - RH_HIGH
  - WMAX_LOW
  - WMAX_MID
  - WMAX_HIGH
  - U700
  - V700
  - U300
  - V300
  - LWUPT
  - LWCRE
  - MAXMF
  - PREC_CU_1H
  - PREC_GRID_1H
  wrf_cloud_normalization_file: assets/normalization/wrf_cloud.json
  include_static: true
  include_time: true
  teacher_forcing: true
  predicted_history_cache_dir: null
  require_predicted_history_cache: false
  predicted_history_require_manifest: true
  predicted_history_start_epoch: 21
  predicted_history_full_epoch: 21
  predicted_history_max_probability: 0.75
  history_teacher_noise_std_k: 3.0
  history_teacher_drop_prob: 0.05
  history_teacher_bias_std_k: 2.0
  history_teacher_blur_prob: 0.15
  history_teacher_block_scale:
  - 0.0
  - 1.0
  - 1.0
  - 1.0
  - 1.0
  west_edge_weighting: false
  normalize_b13: true
  b13_clip:
  - 180.0
  - 330.0
  cot_clip_max: 150.0
  splits:
    train:
      start: '2025-01-01'
      end: '2025-10-31'
    val:
      start: '2025-11-01'
      end: '2025-11-30'
    test:
      start: '2025-12-01'
      end: '2025-12-31'
model:
  name: noAer
  architecture: grouped_conditional_unet3d_wrfcloud
  base_channels: 160
  channel_mult:
  - 1
  - 2
  - 4
  condition_embed_channels: 80
  wrf_cloud_embed_channels: 80
  temporal_attention_heads: 8
  diffusion_steps: 1000
  sampling_steps: 100
  sampler: ddim
  ddim_eta: 0.0
  timestep_embedding: sincos
  target_channels: 1
sampling:
  sampler: ddim
  steps: 100
  eta: 0.0
  guidance_scale: 0.0
  clamp_mode: per_step
  clamp_min: 0.0
  clamp_max: 1.0
  dynamic_threshold_percentile: 0.995
  use_ema: true
  seed: 42
  ensemble_members: 1
  seed_mode: sample_keyed
cfg:
  enabled: true
  dropout_prob: 0.1
  drop_history: true
  drop_wrf_regular: true
  drop_wrf_cloud: true
  drop_aerosol: true
  keep_static_time: true
diffusion:
  offset_noise_enabled: false
  offset_noise_scale: 0.0
  offset_noise_mode: per_channel_time
training:
  batch_size: 3
  num_workers: 0
  epochs: 80
  lr: 2.0e-05
  lr_warmup_epochs: 5
  min_lr: 1.0e-06
  amp: true
  amp_dtype: bfloat16
  gradient_accumulation_steps: 1
  grad_clip_norm: 0.5
  ema: true
  ema_decay: 0.9995
  ema_validate: true
  checkpoint_every: 0
  checkpoint_epochs:
  - 20
  - 40
  - 60
  - 80
  cascade_block_loss_weights:
  - 1.0
  - 1.15
  - 1.3
  - 1.45
  - 1.6
  lambda_b13_recon: 0.08
  b13_recon_loss_mode: smooth_l1
  recon_loss_start_epoch: 1
  recon_loss_warmup_epochs: 5
  recon_loss_max_t_fraction: 0.35
  lambda_b13_bias: 0.04
  b13_bias_loss_mode: mse
  bias_loss_start_epoch: 1
  bias_loss_warmup_epochs: 5
  bias_loss_max_t_fraction: 0.35
  lambda_daylight_bias: 0.05
  daylight_bias_loss_mode: mse
  daylight_bias_start_epoch: 1
  daylight_bias_warmup_epochs: 5
  daylight_bias_max_t_fraction: 0.35
  lambda_b13_lead_bias: 0.06
  b13_lead_bias_loss_mode: mse
  lead_bias_start_epoch: 1
  lead_bias_warmup_epochs: 5
  lead_bias_max_t_fraction: 0.35
  lambda_daylight_lead_bias: 0.06
  daylight_lead_bias_loss_mode: mse
  daylight_lead_bias_start_epoch: 1
  daylight_lead_bias_warmup_epochs: 5
  daylight_lead_bias_max_t_fraction: 0.35
  lambda_b13_gradient_recon: 0.02
  b13_gradient_recon_loss_mode: smooth_l1
  gradient_recon_start_epoch: 1
  gradient_recon_warmup_epochs: 5
  gradient_recon_max_t_fraction: 0.35
  lambda_boundary_consistency: 0.05
  boundary_consistency_loss_mode: smooth_l1
  boundary_consistency_start_epoch: 1
  boundary_consistency_warmup_epochs: 5
  boundary_consistency_max_t_fraction: 0.35
  lambda_b13_temporal_gradient: 0.05
  lambda_b13_temporal_acceleration: 0.015
  temporal_consistency_loss_mode: smooth_l1
  temporal_consistency_start_epoch: 1
  temporal_consistency_warmup_epochs: 5
  temporal_consistency_max_t_fraction: 0.35
  cold_cloud_thresholds_k:
  - 241.0
  - 225.0
  - 210.0
  cold_cloud_threshold_weights:
  - 1.0
  - 1.2
  - 1.4
  cold_cloud_softness_k: 4.0
  lambda_cold_cloud_area: 0.02
  lambda_cold_cloud_dice: 0.04
  lambda_cold_cloud_retention: 0.02
  lambda_cold_cloud_false_alarm: 0.02
  cold_cloud_start_epoch: 1
  cold_cloud_warmup_epochs: 5
  cold_cloud_max_t_fraction: 0.35
  validation_seed: 3042
  validation_timestep_mode: stratified
  validation_timestep_bins: 10
  validation_noise_mode: fixed
  rollout_validation_every: 5
  rollout_validation_max_files: 8
  rollout_validation_sampling_steps: 100
  rollout_validation_metrics_min_lon: 80.0
  rollout_guard_enabled: true
  rollout_guard_action: warn
  rollout_guard_start_epoch: 20
  rollout_guard_max_abs_bias_k: 5.0
  rollout_guard_max_rmse_delta_k: 1.0
  rollout_guard_patience: 2
  rollout_best_start_epoch: 20
  rollout_best_max_abs_bias_k: 5.0
  rollout_best_min_pearson_r: 0.6
  seed: 42
output:
  output_dir: runs/noAer
